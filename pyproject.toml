[project]
name = "renault-api"
version = "0.5.13"
description = "Renault API"
authors = [{ name = "epenet" }]
license = "MIT"
requires-python = ">=3.10"
readme = "README.rst"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Warning: as of 2024-04-23, aiohttp is pinned to 3.9.5 on HA-core
    "aiohttp>=3.9.5",
    # Warning: as of 2023-07-19, pyjwt is pinned to 2.8.0 on HA-core
    "PyJWT>=2.8.0",
    "marshmallow-dataclass>=8.2.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.0.1",
    "dateparser>=1.0.0",
    "tabulate>=0.8.7",
]

[project.scripts]
renault-api = "renault_api.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/hacf-fr/renault-api"
Repository = "https://github.com/hacf-fr/renault-api"
Documentation = "https://renault-api.readthedocs.io"
Changelog = "https://github.com/hacf-fr/renault-api/releases"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.dev.dependencies]
pytest = "==9.1.1"
coverage = {extras = ["toml"], version = "7.16.2"}
safety = "==3.8.1"
pre-commit = "==4.6.2"
ruff = "==0.16.9"
pre-commit-hooks = "==6.0.0"
pytest-asyncio = "==1.4.0"
aiointercept = "0.1.12"
pytest-cov = "==7.1.0"
syrupy = "==6.1.1"

# docs (Python >= 3.14)
furo = {version = "==2025.12.19", python = ">=3.14"}
myst-parser = {version = "==5.1.0", python = ">=3.14"}
sphinx = {version = "==9.1.0", python = ">=3.14"}
sphinx-autobuild = {version = "==2025.8.25", python = ">=3.14"}
sphinx-click = {version = "==6.2.0", python = ">=3.14"}
ty = "0.0.84"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["renault_api"]

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python-version = "3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "A001",    # Variable is shadowing a Python builtin
    "A002",    # Argument is shadowing a Python builtin
    "N815",    # Variable in class scope should not be mixedCase
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
]
select = [
    "A",     # flake8-builtins
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "E",     # pycodestyle error
    "ERA",   # eradicate
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "PL",    # Pylint
    "PT",    # flake8-pytest-style
    "UP",    # pyupgrade
]

[tool.ruff.lint.isort]
force-single-line = true
known-local-folder = [
    "renault_api",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
