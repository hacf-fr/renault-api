name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.14", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.11", os: ubuntu-latest }
          - { python-version: "3.10", os: ubuntu-latest }
          - { python-version: "3.14", os: windows-latest }
          - { python-version: "3.14", os: macos-latest }

    env:
      # Install into site-packages so coverage paths map back to src on every OS
      UV_NO_EDITABLE: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.15"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests
        run: |
          uv run --locked --all-extras --no-group docs coverage run --parallel -m pytest

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.os }}
          path: ".coverage.*"
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.15"
          python-version: "3.14"
          enable-cache: true

      - name: Download coverage data
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage data and display human readable report
        run: |
          uv run --locked --no-group docs coverage combine
          uv run --locked --no-group docs coverage report

      - name: Create coverage report
        run: |
          uv run --locked --no-group docs coverage xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
