name: Release Drafter

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-release-draft:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      # Needed to create and update the draft release
      contents: write
      # Needed to read merged pull requests and their labels
      pull-requests: read
    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
